name = "uniformity-check"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["UniformityCheck"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "uniformity"
path = "../leanfinal"

[[lean_lib]]
name = "UniformityCheck"
